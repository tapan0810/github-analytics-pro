name: Repository Quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test detected projects
        shell: bash
        run: |
          if [ -f package.json ]; then npm ci && npm run build --if-present && npm test --if-present -- --watch=false; fi
          for project in $(find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*'); do dotnet build "$project" -c Release; done
